name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  autofix-v06:
    name: V0.6 formatter repair
    if: github.ref == 'refs/heads/feat/v0.6-windows-agent-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic compiler repairs
        shell: python
        run: |
          from pathlib import Path

          terminal = Path('crates/latch-terminal/src/lib.rs')
          text = terminal.read_text()
          text = text.replace('    env,\n', '', 1)
          terminal.write_text(text)

          platform = Path('crates/latch-windows/src/platform.rs')
          text = platform.read_text()
          text = text.replace('use tracing::warn;\n', '', 1)
          old = '''    fn element(&mut self, session_id: SessionId, element_ref: UiRef) -> Result<&UIElement, WindowsError> {
        let Some(record) = self.refs.get(&element_ref) else {
            return Err(WindowsError::StaleRef);
        };
        if record.session_id != session_id {
            return Err(WindowsError::RefSessionMismatch);
        }
        match record.element.get_runtime_id() {
            Ok(runtime_id) if runtime_id == record.runtime_id => Ok(&record.element),
            _ => {
                self.refs.remove(&element_ref);
                Err(WindowsError::StaleRef)
            }
        }
    }
'''
          new = '''    fn element(&mut self, session_id: SessionId, element_ref: UiRef) -> Result<&UIElement, WindowsError> {
        let is_stale = {
            let Some(record) = self.refs.get(&element_ref) else {
                return Err(WindowsError::StaleRef);
            };
            if record.session_id != session_id {
                return Err(WindowsError::RefSessionMismatch);
            }
            !matches!(
                record.element.get_runtime_id(),
                Ok(runtime_id) if runtime_id == record.runtime_id
            )
        };
        if is_stale {
            self.refs.remove(&element_ref);
            return Err(WindowsError::StaleRef);
        }
        Ok(&self
            .refs
            .get(&element_ref)
            .expect("validated UI ref must still exist")
            .element)
    }
'''
          if old in text:
              text = text.replace(old, new, 1)
          platform.write_text(text)
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "chore: rustfmt v0.6"
          git push origin HEAD:feat/v0.6-windows-agent-runtime

  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  windows:
    name: Windows test/build/package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Verify WiX V0.6 metadata
        shell: pwsh
        run: |
          [xml]$wix = Get-Content 'installer\Latch.wxs' -Raw
          $package = $wix.SelectSingleNode("//*[local-name()='Package']")
          if (-not $package) { throw 'WiX Package element missing' }
          if ($package.Version -ne '0.6.0') { throw "Unexpected WiX Version: $($package.Version)" }
          if ($package.UpgradeCode -ne '6B9638AD-38B8-4EA2-88EF-76D9961EBC4C') { throw "Unexpected UpgradeCode: $($package.UpgradeCode)" }
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6 --add-source https://api.nuget.org/v3/index.json
      - name: Build Windows installer
        run: ./scripts/build-windows-installer.ps1
      - name: Verify MSI metadata and payload
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\LatchSetup-x64.msi').Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductVersion'")
          $view.Execute()
          $record = $view.Fetch()
          if (-not $record) { throw 'MSI ProductVersion missing' }
          $productVersion = $record.StringData(1)
          if ($productVersion -ne '0.6.0') { throw "Unexpected MSI ProductVersion: $productVersion" }
          $view.Close()

          $extract = Join-Path $env:RUNNER_TEMP 'latch-msi'
          $process = Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$extract`"" -Wait -PassThru
          if ($process.ExitCode) { throw "MSI extraction failed with $($process.ExitCode)" }
          $cli = Get-ChildItem $extract -Filter latch.exe -Recurse | Select-Object -First 1
          $desktop = Get-ChildItem $extract -Filter LatchDesktop.exe -Recurse | Select-Object -First 1
          if (-not $cli) { throw 'latch.exe missing' }
          if (-not $desktop) { throw 'LatchDesktop.exe missing' }
          $version = & $cli.FullName --version
          if ($version -ne 'latch 0.6.0-beta.1') { throw "Unexpected binary version: $version" }
      - name: Smoke-test clean MSI install and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\LatchSetup-x64.msi').Path
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode) { throw "MSI install failed with $($install.ExitCode)" }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Latch'
          $cli = Join-Path $installDir 'latch.exe'
          $desktop = Join-Path $installDir 'LatchDesktop.exe'
          if (-not (Test-Path $cli)) { throw 'Installed latch.exe missing' }
          if (-not (Test-Path $desktop)) { throw 'Installed LatchDesktop.exe missing' }
          $version = & $cli --version
          if ($version -ne 'latch 0.6.0-beta.1') { throw "Unexpected installed version: $version" }
          $uninstall = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($uninstall.ExitCode) { throw "MSI uninstall failed with $($uninstall.ExitCode)" }
          if (Test-Path $cli) { throw 'latch.exe remained after uninstall' }
          if (Test-Path $desktop) { throw 'LatchDesktop.exe remained after uninstall' }
      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: Latch-Windows-v0.6.0-beta.1
          path: |
            artifacts/LatchSetup-x64.msi
            artifacts/latch-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  router:
    name: Router quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web

  remote-e2e:
    name: Router to local engine E2E
    runs-on: ubuntu-latest
    needs: [quality, router]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p latch-link
      - run: npm install --prefix router
      - run: npm run build --prefix router
      - run: node router/scripts/e2e-local.mjs
      - run: npm run e2e:mcp --prefix router
