name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace

  windows:
    name: Windows test/build/package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6 --add-source https://api.nuget.org/v3/index.json
      - name: Build Windows installer
        run: ./scripts/build-windows-installer.ps1
      - name: Verify MSI contains tray app and CLI
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'latch-msi'
          $process = Start-Process msiexec.exe -ArgumentList '/a', 'artifacts\LatchSetup-x64.msi', '/qn', "TARGETDIR=$extract" -Wait -PassThru
          if ($process.ExitCode) { throw "MSI extraction failed with $($process.ExitCode)" }
          if (-not (Get-ChildItem $extract -Filter latch.exe -Recurse | Select-Object -First 1)) { throw 'latch.exe missing' }
          if (-not (Get-ChildItem $extract -Filter LatchDesktop.exe -Recurse | Select-Object -First 1)) { throw 'LatchDesktop.exe missing' }
      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: Latch-Windows-v0.5.0-beta.1
          path: |
            artifacts/LatchSetup-x64.msi
            artifacts/latch-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  router:
    name: Router quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web

  remote-e2e:
    name: Router to local engine E2E
    runs-on: ubuntu-latest
    needs: [quality, router]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p latch-link
      - run: npm install --prefix router
      - run: npm run build --prefix router
      - run: node router/scripts/e2e-local.mjs
      - run: npm run e2e:mcp --prefix router
