name: Windows beta release

on:
  push:
    tags: ['v*']
    branches: ['release/v0.4.5-beta.1']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release ref
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v0.4.5-beta.1" -and "${{ github.ref_name }}" -ne "release/v0.4.5-beta.1") {
            throw "Unexpected release ref: ${{ github.ref_name }}"
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6 --add-source https://api.nuget.org/v3/index.json
      - name: Build installer
        run: ./scripts/build-windows-installer.ps1
      - name: Verify packaged applications
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'latch-msi'
          $process = Start-Process msiexec.exe -ArgumentList '/a', 'artifacts\LatchSetup-x64.msi', '/qn', "TARGETDIR=$extract" -Wait -PassThru
          if ($process.ExitCode) { throw "MSI extraction failed with $($process.ExitCode)" }
          $cli = Get-ChildItem $extract -Filter latch.exe -Recurse | Select-Object -First 1
          $desktop = Get-ChildItem $extract -Filter LatchDesktop.exe -Recurse | Select-Object -First 1
          if (-not $cli) { throw 'latch.exe is missing from MSI' }
          if (-not $desktop) { throw 'LatchDesktop.exe is missing from MSI' }
          $version = & $cli.FullName --version
          if ($version -ne 'latch 0.4.5-beta.1') { throw "Unexpected version: $version" }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.4.5-beta.1'
          if (gh release view $tag 2>$null) {
            Write-Output "Release $tag already exists; nothing to publish."
            exit 0
          }
          gh release create $tag artifacts/* --target 54fa707ff92aa753e51019e020f65aee8fa81a4b --prerelease --generate-notes --title "Latch $tag"
