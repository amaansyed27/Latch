name: Windows beta release

on:
  push:
    branches: ['publish/v0.4.5-beta.1']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aa1fa7c3ccef498b094d53b461c6ba4fbb24b3fc
      - name: Verify release source
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne "aa1fa7c3ccef498b094d53b461c6ba4fbb24b3fc") { throw "Release source is not the merged main commit." }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6 --add-source https://api.nuget.org/v3/index.json
      - name: Build installer
        run: ./scripts/build-windows-installer.ps1
      - name: Verify packaged applications
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'latch-msi'
          $process = Start-Process msiexec.exe -ArgumentList '/a', 'artifacts\LatchSetup-x64.msi', '/qn', "TARGETDIR=$extract" -Wait -PassThru
          if ($process.ExitCode) { throw "MSI extraction failed with $($process.ExitCode)" }
          $cli = Get-ChildItem $extract -Filter latch.exe -Recurse | Select-Object -First 1
          $desktop = Get-ChildItem $extract -Filter LatchDesktop.exe -Recurse | Select-Object -First 1
          if (-not $cli) { throw 'latch.exe is missing from MSI' }
          if (-not $desktop) { throw 'LatchDesktop.exe is missing from MSI' }
          $version = & $cli.FullName --version
          if ($version -ne 'latch 0.4.5-beta.1') { throw "Unexpected version: $version" }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.4.5-beta.1" artifacts/* --target "aa1fa7c3ccef498b094d53b461c6ba4fbb24b3fc" --prerelease --generate-notes --title "Latch v0.4.5-beta.1"
