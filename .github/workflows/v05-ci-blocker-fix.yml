name: V0.5 CI blocker fix

on:
  push:
    branches: ["feat/v0.5-complete-local-agent"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.5-complete-local-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path

          p = Path('crates/latch-desktop/src/main.rs')
          s = p.read_text()
          s = s.replace('let pause =\n                    MenuItemBuilder::with_id("pause", "Pause remote access").build(app)?;', 'let pause = MenuItemBuilder::with_id("pause", "Pause remote access").build(app)?;', 1)
          p.write_text(s)

          p = Path('crates/latch-computer/src/lib.rs')
          s = p.read_text().replace('use winsafe::{prelude::*, HWND};', 'use winsafe::HWND;', 1)
          if 'Some(Ok(RawWindow {' not in s:
              raise SystemExit('RawWindow opener missing')
          s = s.replace('Some(Ok(RawWindow {', 'Some((|| {\n                    Ok(RawWindow {', 1)
          old = '                }))\n            })\n            .collect()'
          new = '                    })\n                })())\n            })\n            .collect()'
          if old not in s:
              raise SystemExit('RawWindow closer missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('router/src/mcp-server.ts')
          s = p.read_text()
          s = s.replace('async ({ device_id, server_id, tool_name, arguments }) =>', 'async ({ device_id, server_id, tool_name, arguments: toolArguments }) =>', 1)
          s = s.replace('        tool_name,\n        arguments,\n      }),', '        tool_name,\n        arguments: toolArguments,\n      }),', 1)
          s = s.replace('  const content: Array<Record<string, unknown>> = [];', "  const content: Array<{ type: 'text'; text: string } | { type: 'image'; data: string; mimeType: string }> = [];", 1)
          p.write_text(s)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-desktop/src/main.rs crates/latch-computer/src/lib.rs router/src/mcp-server.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: clear v0.5 compile and type blockers"
          git push origin HEAD:feat/v0.5-complete-local-agent
