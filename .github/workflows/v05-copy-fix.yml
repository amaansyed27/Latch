name: Apply V0.5 hardening copy fixes

on:
  push:
    branches:
      - fix/v0.5-release-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5-release-hardening
          fetch-depth: 0
      - name: Update pairing and download copy
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('router/web/src/pages/Info.tsx'): [
                  ('["Install", "Run the installer, then open a new Terminal."],',
                   '["Install", "Run the installer, then open Latch from the Start menu."],'),
                  ('"Pairing codes work once and expire after 10 minutes. Generate a fresh code in Devices, then paste the full command into Windows Terminal.",',
                   '"Pairing codes work once and expire after 10 minutes. Generate a fresh code in Devices, then open Latch from the Start menu or tray and paste the code into Latch Desktop. The CLI remains available as a fallback.",'),
              ],
              Path('router/web/src/pages/Devices.tsx'): [
                  ('<p>Run one command to connect it.</p>',
                   '<p>Create a one-time code here, then paste it into Latch Desktop.</p>'),
              ],
              Path('router/web/src/pages/Download.tsx'): [
                  ('<span className="version">v0.4.5-beta.1</span>',
                   '<span className="version">v0.5.0-beta.1</span>'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          for path in replacements:
              text = path.read_text(encoding='utf-8')
              if 'paste the full command into Windows Terminal' in text:
                  raise SystemExit(f'Stale terminal-first pairing text remains in {path}')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/v05-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add router/web/src/pages/Info.tsx router/web/src/pages/Devices.tsx router/web/src/pages/Download.tsx
          git commit -m "docs: make desktop pairing the primary setup path"
          git push origin HEAD:fix/v0.5-release-hardening
