name: V0.5 quality fix

on:
  push:
    branches: ["feat/v0.5-complete-local-agent"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.5-complete-local-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply quality fixes
        shell: python
        run: |
          from pathlib import Path

          info = Path('router/web/src/pages/Info.tsx')
          s = info.read_text()
          old = '''  Download,
  Eye,
  Eye,
  Eye,
  FileText,
  Folder,
  Laptop,
  LockKeyhole,
  Monitor,
  MousePointer2,
  Plug,
  MousePointer2,
  Plug,
  MousePointer2,
  Plug,
  ShieldCheck,'''
          new = '''  Download,
  Eye,
  FileText,
  Folder,
  Laptop,
  LockKeyhole,
  Monitor,
  MousePointer2,
  Plug,
  ShieldCheck,'''
          if old not in s:
              raise SystemExit('duplicate Lucide import block not found')
          info.write_text(s.replace(old, new, 1))

          mcp = Path('crates/latch-mcp-client/src/lib.rs')
          s = mcp.read_text()
          old = '''    let arguments = arguments.as_object().cloned().ok_or_else(|| {
        McpClientError::Protocol("tool arguments must be a JSON object".to_owned())
    })?;'''
          new = '''    let arguments = match arguments {
        Value::Object(arguments) => arguments,
        _ => {
            return Err(McpClientError::Protocol(
                "tool arguments must be a JSON object".to_owned(),
            ));
        }
    };'''
          if old not in s:
              raise SystemExit('MCP argument conversion target not found')
          s = s.replace(old, new, 1)
          s = s.replace('service.list_tools(Default::default())', 'service.list_tools(Option::default())', 1)
          mcp.write_text(s)
      - name: Refresh lockfiles and format
        run: |
          cargo fmt --all
          npm install --package-lock-only --prefix router
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-mcp-client/src/lib.rs router/web/src/pages/Info.tsx router/package-lock.json
          git commit -m "fix: clear v0.5 quality gates and refresh router lockfile"
          git push origin HEAD:feat/v0.5-complete-local-agent
