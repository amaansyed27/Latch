name: V0.5 Rust repair

on:
  push:
    branches: ["feat/v0.5-complete-local-agent"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.5-complete-local-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply compile and Clippy fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          local = Path('crates/latch-local/src/lib.rs')
          text = local.read_text()
          text = text.replace(
              '#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct Permissions {',
              '#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\n#[allow(clippy::struct_excessive_bools)]\npub struct Permissions {',
              1,
          )
          text = text.replace(
              '#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct LocalConfig {',
              '#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq, Eq)]\npub struct LocalConfig {',
              1,
          )
          text = re.sub(
              r'\nimpl Default for LocalConfig \{\n    fn default\(\) -> Self \{\n        Self \{\n            paused: false,\n            legacy_absolute_workspaces: false,\n            permissions: Permissions::default\(\),\n            roots: Vec::new\(\),\n            mcp_servers: Vec::new\(\),\n        \}\n    \}\n\}\n',
              '\n',
              text,
              count=1,
          )
          text = text.replace(
              '''    path.file_name()\n        .filter(|name| !name.is_empty())\n        .map(|name| name.to_string_lossy().into_owned())\n        .unwrap_or_else(|| path.display().to_string())''',
              '''    path.file_name().filter(|name| !name.is_empty()).map_or_else(\n        || path.display().to_string(),\n        |name| name.to_string_lossy().into_owned(),\n    )''',
              1,
          )
          local.write_text(text)

          managed = Path('crates/latch-exec/src/managed.rs')
          text = managed.read_text()
          text = text.replace(
              '''        let process = lock(&handle);\n        Ok(ManagedOutput {\n            stdout: lock(&process.stdout).snapshot(),\n            stderr: lock(&process.stderr).snapshot(),\n        })''',
              '''        let process = lock(&handle);\n        let stdout = lock(&process.stdout).snapshot();\n        let stderr = lock(&process.stderr).snapshot();\n        Ok(ManagedOutput { stdout, stderr })''',
              1,
          )
          managed.write_text(text)
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.lock
          git commit -m "fix: clear v0.5 Rust compile and lint failures"
          git push origin HEAD:feat/v0.5-complete-local-agent
