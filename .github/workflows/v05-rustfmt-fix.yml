name: Apply V0.5 rustfmt fix

on:
  push:
    branches:
      - fix/v0.5-release-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.5-release-hardening
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/v05-rustfmt-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-daemon/tests/daemon.rs
          git commit -m "test: format deterministic daemon polling check"
          git push origin HEAD:fix/v0.5-release-hardening
