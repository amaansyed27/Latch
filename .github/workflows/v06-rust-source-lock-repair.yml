name: V0.6 Rust source and lock repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/repair-mcp-entry-and-lock.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-rust-source-lock-repair.yml scripts/repair-mcp-entry-and-lock.py
          git add crates/latch-mcp-client/src/lib.rs Cargo.lock
          git commit -m "fix: use MCP map entry and refresh lockfile"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
