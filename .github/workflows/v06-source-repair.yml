name: V0.6 source repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair MCP manager clippy failures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/latch-mcp-client/src/lib.rs')
          text = path.read_text()
          text = text.replace('    display_name: String,\n', '')
          text = text.replace('                display_name: server.display_name.clone(),\n', '')
          text = text.replace(
              '    if !state.connections.contains_key(&server.server_id) {\n',
              '    let connection_missing = state.connections.get(&server.server_id).is_none();\n    if connection_missing {\n',
          )
          text = text.replace(
              '''            (!allowed
                  .get(server_id)
                  .is_some_and(|fingerprint| *fingerprint == connection.fingerprint))
              .then_some(*server_id)
''',
              '''            allowed
                .get(server_id)
                .is_none_or(|fingerprint| *fingerprint != connection.fingerprint)
                .then_some(*server_id)
''',
          )
          path.write_text(text)
          PY
      - run: cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-mcp-client/src/lib.rs
          git commit -m "fix: satisfy clippy in persistent MCP manager"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
