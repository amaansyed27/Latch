name: V0.6 source repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic compiler and compatibility repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          terminal = Path('crates/latch-terminal/src/lib.rs')
          text = terminal.read_text()
          text = text.replace('    env,\n', '', 1)
          terminal.write_text(text)

          platform = Path('crates/latch-windows/src/platform.rs')
          text = platform.read_text()
          text = text.replace('use tracing::warn;\n', '', 1)
          start = text.index('    fn element(')
          end = text.index('\n    fn ', start + 1)
          replacement = '''    fn element(&mut self, session_id: SessionId, element_ref: UiRef) -> Result<&UIElement, WindowsError> {
              let is_stale = {
                  let Some(record) = self.refs.get(&element_ref) else {
                      return Err(WindowsError::StaleRef);
                  };
                  if record.session_id != session_id {
                      return Err(WindowsError::RefSessionMismatch);
                  }
                  !matches!(
                      record.element.get_runtime_id(),
                      Ok(runtime_id) if runtime_id == record.runtime_id
                  )
              };
              if is_stale {
                  self.refs.remove(&element_ref);
                  return Err(WindowsError::StaleRef);
              }
              Ok(&self
                  .refs
                  .get(&element_ref)
                  .expect("validated UI ref must still exist")
                  .element)
          }'''
          platform.write_text(text[:start] + replacement + text[end:])

          auth = Path('router/test/public-auth.test.ts')
          text = auth.read_text()
          text = text.replace("name: 'latch_devices_list', arguments: {}", "name: 'latch_devices', arguments: {}")
          text = text.replace(
              "name: 'latch_workspace_open', arguments: { device_id: DEVICE_B, root_id: DEVICE_A }",
              "name: 'latch_files', arguments: { device_id: DEVICE_B, request: { op: 'open_workspace', root_id: DEVICE_A } }",
          )
          text = text.replace(
              "name: 'latch_file_read', arguments: { device_id: DEVICE_A, workspace_id: DEVICE_B, relative_path: 'README.md' }",
              "name: 'latch_files', arguments: { device_id: DEVICE_A, request: { op: 'read', workspace_id: DEVICE_B, path: 'README.md' } }",
          )
          text = text.replace(
              "name: 'latch_exec_run', arguments: { device_id: DEVICE_A, workspace_id: DEVICE_B, program: 'node', args: [] }",
              "name: 'latch_exec', arguments: { device_id: DEVICE_A, request: { op: 'run', session_id: DEVICE_A, workspace_id: DEVICE_B, program: 'node', args: [] } }",
          )
          auth.write_text(text)
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates router/test/public-auth.test.ts
          git commit -m "fix: format and repair v0.6 runtime"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
