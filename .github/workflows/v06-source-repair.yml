name: V0.6 source repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python scripts/repair-mcp-ci.py
      - run: cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-mcp-client/src/lib.rs
          git commit -m "fix: satisfy clippy in persistent MCP manager"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
