name: V0.6 source repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair terminal platform imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/latch-terminal/src/lib.rs')
          text = path.read_text()
          old = '''use std::{
              collections::HashMap,
              io::{Read, Write},
              path::{Path, PathBuf},
              process::Command,
              sync::{Arc, Mutex, MutexGuard, PoisonError},
              thread::{self, JoinHandle},
          };
          '''
          new = '''use std::{
              collections::HashMap,
              io::{Read, Write},
              path::Path,
              sync::{Arc, Mutex, MutexGuard, PoisonError},
              thread::{self, JoinHandle},
          };
          #[cfg(not(windows))]
          use std::env;
          #[cfg(windows)]
          use std::{path::PathBuf, process::Command};
          '''
          if old not in text:
              raise SystemExit('terminal import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/latch-terminal/src/lib.rs
          git commit -m "fix: scope terminal imports by platform"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
