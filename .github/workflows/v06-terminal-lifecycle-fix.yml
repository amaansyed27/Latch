name: V0.6 terminal lifecycle fix

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair PTY shutdown ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/latch-terminal/src/lib.rs')
          text = path.read_text()
          replacements = [
              ('            master: pair.master,\n', '            master: Some(pair.master),\n'),
              ('            writer,\n', '            writer: Some(writer),\n'),
              ('            _job: job,\n', '            _job: Some(job),\n'),
              ('    master: Box<dyn MasterPty + Send>,\n', '    master: Option<Box<dyn MasterPty + Send>>,\n'),
              ('    writer: Box<dyn Write + Send>,\n', '    writer: Option<Box<dyn Write + Send>>,\n'),
              ('    _job: win32job::Job,\n', '    _job: Option<win32job::Job>,\n'),
              ('''        terminal.writer.write_all(text.as_bytes())?;
          terminal.writer.flush()?;
''', '''        let writer = terminal
              .writer
              .as_mut()
              .ok_or(TerminalError::NotRunning(terminal_id))?;
          writer.write_all(text.as_bytes())?;
          writer.flush()?;
'''),
              ('''        terminal
              .master
              .resize(PtySize {
''', '''        terminal
              .master
              .as_ref()
              .ok_or(TerminalError::NotRunning(terminal_id))?
              .resize(PtySize {
'''),
              ('''    fn kill(&mut self) -> Result<(), TerminalError> {
          if matches!(self.state()?, TerminalState::Running) {
              self.child.kill()?;
          }
          self.killed = true;
          if let Some(reader) = self.reader_task.take() {
              let _ = reader.join();
          }
          Ok(())
      }
''', '''    fn kill(&mut self) -> Result<(), TerminalError> {
          if matches!(self.state()?, TerminalState::Running) {
              self.child.kill()?;
              #[cfg(windows)]
              self._job.take();
              let _ = self.child.wait()?;
          }
          self.killed = true;
          self.writer.take();
          self.master.take();
          if let Some(reader) = self.reader_task.take() {
              let _ = reader.join();
          }
          Ok(())
      }
'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected terminal source fragment not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-terminal-lifecycle-fix.yml
          git add crates/latch-terminal/src/lib.rs
          git commit -m "fix: close PTY handles before joining reader"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
