name: V0.6 Windows terminal repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/repair-windows-terminal-dsr.py
      - run: cargo fmt --all
      - run: cargo test --locked -p latch-terminal
      - run: cargo clippy --locked -p latch-terminal --all-targets -- -D warnings
      - name: Commit repair and remove one-shot files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-windows-terminal-repair.yml scripts/repair-windows-terminal-dsr.py
          git add crates/latch-terminal/src/lib.rs
          git commit -m "fix: answer ConPTY cursor position queries"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
