name: V0.6 Windows terminal repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make PTY test tolerate Windows startup latency
        shell: pwsh
        run: |
          $path = 'crates/latch-terminal/src/lib.rs'
          $text = Get-Content $path -Raw
          if (-not $text.Contains('thread::sleep(Duration::from_millis(350));')) { throw 'first PTY wait marker missing' }
          if (-not $text.Contains('thread::sleep(Duration::from_millis(250));')) { throw 'second PTY wait marker missing' }
          $text = $text.Replace('thread::sleep(Duration::from_millis(350));', 'thread::sleep(Duration::from_secs(2));')
          $text = $text.Replace('thread::sleep(Duration::from_millis(250));', 'thread::sleep(Duration::from_secs(2));')
          Set-Content $path $text -NoNewline
      - run: cargo fmt --all
      - run: cargo test --locked -p latch-terminal
      - name: Commit repair and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-windows-terminal-repair.yml
          git add crates/latch-terminal/src/lib.rs
          git commit -m "test: tolerate Windows PTY startup latency"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
