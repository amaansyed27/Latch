name: V0.6 Windows terminal repair

on:
  push:
    branches:
      - feat/v0.6-windows-agent-runtime

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make PTY test deterministic on Windows
        shell: pwsh
        run: |
          $path = 'crates/latch-terminal/src/lib.rs'
          $text = Get-Content $path -Raw
          $oldCreate = '        let created = manager.create(None, &cwd, 24, 100).unwrap();'
          $newCreate = @'
          #[cfg(windows)]
          let profile_id = Some("cmd");
          #[cfg(not(windows))]
          let profile_id = None;
          let created = manager.create(profile_id, &cwd, 24, 100).unwrap();
          '@
          if (-not $text.Contains($oldCreate)) { throw 'PTY create marker missing' }
          $text = $text.Replace($oldCreate, $newCreate.TrimEnd())
          $text = $text.Replace('"echo LATCH_PTY_TEST\r\n"', '"echo LATCH_PTY_TEST\r"')
          $text = $text.Replace('"echo SECOND\r\n"', '"echo SECOND\r"')
          $text = $text.Replace('thread::sleep(Duration::from_millis(350));', 'thread::sleep(Duration::from_secs(2));')
          $text = $text.Replace('thread::sleep(Duration::from_millis(250));', 'thread::sleep(Duration::from_secs(2));')
          $text = $text.Replace('assert!(first.logical_screen.contains("LATCH_PTY_TEST"));', 'assert!(first.logical_screen.contains("LATCH_PTY_TEST"), "first snapshot: {first:?}");')
          $text = $text.Replace('assert!(second.output.contains("SECOND"));', 'assert!(second.output.contains("SECOND"), "second snapshot: {second:?}");')
          Set-Content $path $text -NoNewline
      - run: cargo fmt --all
      - run: cargo test --locked -p latch-terminal
      - name: Commit repair and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v06-windows-terminal-repair.yml
          git add crates/latch-terminal/src/lib.rs
          git commit -m "test: make Windows PTY checks deterministic"
          git push origin HEAD:feat/v0.6-windows-agent-runtime
